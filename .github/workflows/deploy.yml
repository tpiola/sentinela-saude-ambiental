name: Build & Deploy Sentinela

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/tpiola/sentinela:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS update via Hostinger API
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_TOKEN }}" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/830509/docker/sentinela/update"
