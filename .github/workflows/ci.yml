# Mesmo fluxo que a produção na Vercel costuma usar: instalar → lint → build.
name: CI

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (verificação)
        run: npm run format:check

      - name: Compilação Next.js (produção)
        run: npm run build
