<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cantos</title>
<link rel="stylesheet" href="../styles.css">
<style>

.row{display:flex;gap:10px;flex-wrap:wrap}

.chip{height:52px;border-radius:0}

.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<div style="text-align:center;width:82px"><div style="width:82px;height:52px;background:var(--brand-surface);border:1px solid var(--brand-border);border-radius:0"></div><p class="nm">0</p><p class="tok">--radius-none</p><p class="tok">CTA, cartão de seção, formulário</p></div><div style="text-align:center;width:82px"><div style="width:82px;height:52px;background:var(--brand-surface);border:1px solid var(--brand-border);border-radius:8px"></div><p class="nm">8px</p><p class="tok">--radius-sm</p><p class="tok">—</p></div><div style="text-align:center;width:82px"><div style="width:82px;height:52px;background:var(--brand-surface);border:1px solid var(--brand-border);border-radius:12px"></div><p class="nm">12px</p><p class="tok">--radius-md</p><p class="tok">tile de praga, botão mobile</p></div><div style="text-align:center;width:82px"><div style="width:82px;height:52px;background:var(--brand-surface);border:1px solid var(--brand-border);border-radius:16px"></div><p class="nm">16px</p><p class="tok">--radius-lg</p><p class="tok">galeria, FAQ</p></div><div style="text-align:center;width:82px"><div style="width:82px;height:52px;background:var(--brand-surface);border:1px solid var(--brand-border);border-radius:24px"></div><p class="nm">24px</p><p class="tok">--radius-xl</p><p class="tok">foto Sobre</p></div><div style="text-align:center;width:82px"><div style="width:82px;height:52px;background:var(--brand-surface);border:1px solid var(--brand-border);border-radius:999px"></div><p class="nm">999px</p><p class="tok">--radius-pill</p><p class="tok">badge, chip, float</p></div>
