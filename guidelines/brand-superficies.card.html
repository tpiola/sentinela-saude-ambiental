<!-- @dsCard group="Brand" viewport="700x200" name="Superfícies e sombras" subtitle="Branco · #f0f4f8 · navy · glass 5% — sombra quase ausente" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Superfícies</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
  <div style="background:#fff;border:1px solid var(--brand-border);padding:12px;height:74px"><p class="nm">white</p><p class="tok">--surface-card</p></div>
  <div style="background:var(--brand-surface);border:1px solid var(--brand-border);padding:12px;height:74px"><p class="nm">muted</p><p class="tok">--brand-surface</p></div>
  <div style="background:var(--brand-navy);padding:12px;height:74px"><p class="nm" style="color:#fff">navy</p><p class="tok">--surface-inverse</p></div>
  <div style="background:var(--brand-navy);padding:4px;height:74px"><div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);padding:8px;height:100%"><p class="nm" style="color:#fff">glass</p><p class="tok">branco 5%</p></div></div>
</div>
<div style="display:flex;gap:12px;margin-top:12px">
  <div style="flex:1;background:#fff;border:1px solid var(--brand-border);border-radius:16px;padding:10px;box-shadow:var(--shadow-card)"><p class="tok" style="margin:0">--shadow-card · cartões de FAQ</p></div>
  <div style="flex:1;background:#fff;padding:10px;box-shadow:var(--shadow-elevated)"><p class="tok" style="margin:0">--shadow-elevated · dropdown</p></div>
  <div style="flex:1;background:var(--brand-whatsapp-bright);padding:10px;border-radius:999px;box-shadow:var(--shadow-float),var(--ring-whatsapp)"><p class="tok" style="margin:0;color:#fff">--shadow-float + halo</p></div>
</div>
</body></html>
