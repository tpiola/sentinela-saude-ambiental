<!-- @dsCard group="Colors" viewport="700x180" name="Papéis semânticos" subtitle="Como as cores se aplicam em fundo claro e em navy" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Semânticos</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <div style="background:#fff;border:1px solid var(--brand-border);padding:12px">
    <p style="margin:0;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-eyebrow)">Eyebrow · lima deep</p>
    <p style="margin:6px 0 0;font-family:var(--font-heading);font-size:19px;font-weight:700;color:var(--text-heading)">Título · navy</p>
    <p style="margin:4px 0 0;font-size:12px;color:var(--text-body)">Corpo · muted #4a5568</p>
  </div>
  <div style="background:var(--brand-navy);padding:12px">
    <p style="margin:0;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-eyebrow-inverse)">Eyebrow · lima</p>
    <p style="margin:6px 0 0;font-family:var(--font-heading);font-size:19px;font-weight:700;color:#fff">Título · branco</p>
    <p style="margin:4px 0 0;font-size:12px;color:var(--text-on-inverse-muted)">Corpo · branco 75%</p>
  </div>
</div>
</body></html>
