<!-- @dsCard group="Motion" viewport="700x180" name="Movimento e estados" subtitle="200ms padrão · zoom 1.03 em foto · ponto pulsante · sem bounce" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Movimento</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<style>
.pulse{position:relative;display:inline-flex;height:10px;width:10px}
.pulse i{position:absolute;inset:0;border-radius:999px;background:var(--brand-lime);opacity:.75;animation:sentinela-ping 1s cubic-bezier(0,0,.2,1) infinite}
.pulse b{position:relative;height:10px;width:10px;border-radius:999px;background:var(--brand-lime)}
.hovercard{border:1px solid var(--brand-border);background:var(--brand-surface);padding:10px;font-size:12px;transition:border-color 200ms var(--ease-standard),background-color 200ms var(--ease-standard)}
.hovercard:hover{border-color:var(--brand-lime-deep);background:#fff}
</style>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <span style="display:inline-flex;gap:8px;align-items:center;border-radius:999px;border:1px solid rgba(143,206,42,.3);background:rgba(143,206,42,.1);padding:6px 14px;font-size:12px;font-weight:700;color:var(--brand-lime-deep)"><span class="pulse"><i></i><b></b></span>Resposta &lt; 30 min</span>
  <div class="hovercard">Hover: borda acende em lima deep, fundo vira branco</div>
  <p class="tok" style="margin:0;max-width:220px">--duration-base 200ms · --duration-image 500ms · press scale .98 · nenhuma entrada esconde conteúdo</p>
</div>
</body></html>
