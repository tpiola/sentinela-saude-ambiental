<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Foco</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
  <button style="min-height:44px;padding:0 18px;border:1px solid var(--brand-navy);background:#fff;font:700 13px var(--font-body);color:var(--brand-navy);outline:3px solid var(--brand-navy);outline-offset:3px">Estado :focus-visible</button>
  <p style="margin:0;font-size:14px;color:var(--brand-muted)">Texto com <span style="background:color-mix(in srgb,var(--brand-lime) 35%,white);color:var(--brand-navy-heading)">seleção da marca</span> aplicada.</p>
  <p class="tok" style="margin:0">--focus-ring · 3px · offset 3px</p>
</div>
</body></html>
