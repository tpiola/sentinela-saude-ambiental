<!-- @dsCard group="Spacing" viewport="700x180" name="Container e alvos de toque" subtitle="max 1200px · gutters 16/24/32 · CTA 56px, controle 44px" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Container</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div style="border:1px dashed var(--brand-silver);padding:0 16px">
  <div style="background:var(--brand-surface);border:1px solid var(--brand-border);padding:12px">
    <p style="margin:0;font-size:12px;color:var(--brand-muted)">.container-responsive — max-width 1200px, gutter 16px (mobile) → 24px (sm) → 32px (lg)</p>
  </div>
</div>
<div style="display:flex;gap:10px;align-items:flex-end;margin-top:12px">
  <span style="display:inline-flex;align-items:center;height:56px;padding:0 24px;background:var(--brand-whatsapp);color:#fff;font:700 14px var(--font-body)">CTA · 56px</span>
  <span style="display:inline-flex;align-items:center;height:44px;padding:0 16px;border:1px solid var(--brand-navy);font:700 13px var(--font-body)">Controle · 44px</span>
</div>
</body></html>
