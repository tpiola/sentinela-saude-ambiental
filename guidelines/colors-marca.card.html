<!-- @dsCard group="Colors" viewport="700x150" name="Cores de marca" subtitle="Navy institucional + verde-lima de ação" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cores de marca</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#001428;"></div><p class="nm">Navy heading</p><p class="hex">#001428</p><p class="tok">--brand-navy-heading</p></div>
<div class="sw"><div class="chip" style="background:#002347;"></div><p class="nm">Navy</p><p class="hex">#002347</p><p class="tok">--brand-navy</p></div>
<div class="sw"><div class="chip" style="background:#003066;"></div><p class="nm">Navy soft</p><p class="hex">#003066</p><p class="tok">--brand-navy-soft</p></div>
<div class="sw"><div class="chip" style="background:#8fce2a;"></div><p class="nm">Lima</p><p class="hex">#8fce2a</p><p class="tok">--brand-lime</p></div>
<div class="sw"><div class="chip" style="background:#4f7f12;"></div><p class="nm">Lima deep</p><p class="hex">#4f7f12</p><p class="tok">--brand-lime-deep</p></div>
<div class="sw"><div class="chip" style="background:#b8e96b;"></div><p class="nm">Lima light</p><p class="hex">#b8e96b</p><p class="tok">--brand-green-light</p></div>
<div class="sw"><div class="chip" style="background:#1e6faf;"></div><p class="nm">Azul accent</p><p class="hex">#1e6faf</p><p class="tok">--brand-accent-blue</p></div>
</div>
</body></html>
