<!-- @dsCard group="Colors" viewport="700x170" name="Verdes de conversão" subtitle="#128c4a em CTA sólido · #25D366 só no chrome flutuante" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Conversão</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#128c4a;"></div><p class="nm">WhatsApp CTA</p><p class="hex">#128c4a</p><p class="tok">--brand-whatsapp</p></div>
<div class="sw"><div class="chip" style="background:#25d366;"></div><p class="nm">WhatsApp bright</p><p class="hex">#25d366</p><p class="tok">--brand-whatsapp-bright</p></div>
<div class="sw"><div class="chip" style="background:#1ea352;"></div><p class="nm">WhatsApp active</p><p class="hex">#1ea352</p><p class="tok">--brand-whatsapp-active</p></div>
<div class="sw" style="flex:2 1 240px">
  <div style="display:flex;gap:8px;align-items:center;height:52px">
    <span style="display:inline-flex;align-items:center;height:44px;padding:0 18px;background:var(--brand-whatsapp);color:#fff;font-weight:700;font-size:13px">Chamar no WhatsApp</span>
    <span style="display:inline-flex;align-items:center;justify-content:center;height:44px;width:44px;border-radius:999px;background:var(--brand-whatsapp-bright);box-shadow:0 0 0 4px rgba(37,211,102,.3)"></span>
  </div>
  <p class="nm">CTA sólido vs. botão flutuante</p>
  <p class="tok">o brilhante nunca entra em botão de seção</p>
</div>
</div>
</body></html>
