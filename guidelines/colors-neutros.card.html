<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Neutros</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:88px}
.chip{height:52px;border-radius:0}
.hex{font-family:var(--font-mono);font-size:10px;margin:6px 0 0;color:var(--brand-muted)}
.nm{font-size:11px;font-weight:700;margin:2px 0 0}
.tok{font-family:var(--font-mono);font-size:9.5px;color:var(--brand-silver)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#ffffff;box-shadow:inset 0 0 0 1px #dde4ee"></div><p class="nm">Background</p><p class="hex">#ffffff</p><p class="tok">--background</p></div>
<div class="sw"><div class="chip" style="background:#f0f4f8;"></div><p class="nm">Surface</p><p class="hex">#f0f4f8</p><p class="tok">--brand-surface</p></div>
<div class="sw"><div class="chip" style="background:#dde4ee;"></div><p class="nm">Border</p><p class="hex">#dde4ee</p><p class="tok">--brand-border</p></div>
<div class="sw"><div class="chip" style="background:#a8b4c2;"></div><p class="nm">Silver</p><p class="hex">#a8b4c2</p><p class="tok">--brand-silver</p></div>
<div class="sw"><div class="chip" style="background:#4a5568;"></div><p class="nm">Muted</p><p class="hex">#4a5568</p><p class="tok">--brand-muted</p></div>
<div class="sw"><div class="chip" style="background:#6b7280;"></div><p class="nm">Tagline grey</p><p class="hex">#6b7280</p><p class="tok">--brand-tagline-grey</p></div>
<div class="sw"><div class="chip" style="background:#12202e;"></div><p class="nm">Foreground</p><p class="hex">#12202e</p><p class="tok">--foreground</p></div>
</div>
</body></html>
