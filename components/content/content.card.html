<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Conteúdo</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-preview-loader.js"></script>
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.lbl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-lime-deep);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
</style>
</head><body><div id="root"></div>
<script type="text/x-sentinela-jsx">
  const root = ReactDOM.createRoot(document.getElementById("root"));

  const { FaqItem, PestTile, SectionHeading } = DS;
  const pests = [["escorpiao","Escorpiões"],["baratas","Baratas"],["ratos","Ratos"],["cupins","Cupins"],["formigas","Formigas"],["aranhas","Aranhas"],["mosquitos","Mosquitos"],["caixa-dagua","Caixa d'água"]];
  function App(){
    const [open,setOpen]=React.useState(0);
    return (<div>
      <SectionHeading eyebrow="Atendimento por diagnóstico" title="Primeiro identificamos. Depois tratamos." lead="Cada ocorrência exige uma leitura diferente do ambiente." />
      <p className="lbl">PestTile</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:10}}>
        {pests.map(([p,l])=><PestTile key={p} pest={p} label={l} href="#" />)}
      </div>
      <p className="lbl">FaqItem</p>
      <ul style={{display:"grid",gap:10,margin:0,padding:0}}>
        <FaqItem question="Encontrei um escorpião. O que devo fazer?" answer="Mantenha distância, afaste pessoas e animais e não tente capturá-lo com as mãos. Em caso de picada, procure atendimento de saúde imediatamente." open={open===0} onToggle={()=>setOpen(open===0?null:0)} />
        <FaqItem question="Existe garantia no serviço?" answer="Quando aplicável, prazo, cobertura e condições são descritos na proposta e no comprovante do serviço." open={open===1} onToggle={()=>setOpen(open===1?null:1)} />
      </ul>
    </div>);
  }
  root.render(<App />);
</script>
<script>window.bootSentinela("../../").catch((e) => { document.getElementById("root").textContent = String(e); });</script>
</body></html>
