<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Chrome</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-preview-loader.js"></script>
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--brand-navy)}
.lbl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-lime-deep);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
body{padding:0}
.lbl{margin:14px 18px 8px}</style>
</head><body><div id="root"></div>
<script type="text/x-sentinela-jsx">
  const root = ReactDOM.createRoot(document.getElementById("root"));

  const { SiteHeader, Logo, MobileStickyBar, WhatsAppFloat } = DS;
  const LOGO = "../../assets/logo-brasao.png";
  root.render(
    <div>
      <SiteHeader position="static" scrolled logoSrc={LOGO} />
      <p className="lbl">Logo · compact (navy) · full (claro)</p>
      <div style={{display:"flex",gap:28,alignItems:"center",padding:"0 18px"}}>
        <div style={{background:"var(--brand-navy)",padding:"14px 18px"}}><Logo variant="compact" tone="dark" logoSrc={LOGO} /></div>
        <Logo variant="full" tone="light" logoSrc={LOGO} style={{maxWidth:240}} />
        <WhatsAppFloat position="static" />
      </div>
      <p className="lbl">MobileStickyBar</p>
      <div style={{maxWidth:380,margin:"0 18px 18px"}}><MobileStickyBar position="static" /></div>
    </div>
  );
</script>
<script>window.bootSentinela("../../").catch((e) => { document.getElementById("root").textContent = String(e); });</script>
</body></html>
