<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinela Saúde Ambiental — Dedetizadora em Franca SP</title>
  <meta name="description" content="Dedetizadora em Franca/SP e região. Eliminação de escorpiões, baratas, cupins e roedores com produtos sem cheiro, laudo técnico e atendimento de emergência.">
  <link rel="canonical" href="https://www.sentinelasaudeambiental.com.br/">
  <meta property="og:url" content="https://www.sentinelasaudeambiental.com.br/">
  <meta property="og:title" content="Sentinela Saúde Ambiental — Dedetizadora em Franca SP">
  <meta property="og:description" content="Controle profissional de pragas e escorpiões em Franca. Técnicos licenciados e atendimento no mesmo dia.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Fontes Oficiais de Alta Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <!-- React & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>Babel.registerPreset("react-classic", { presets: [[Babel.availablePresets.react, { runtime: "classic" }]] });</script>
  <script src="ds-preview-loader.js"></script>
  
  <style>
    body { margin: 0; background: #fff; padding-bottom: 0; overflow-x: hidden; }
    .kit-missing { max-width: 620px; margin: 80px auto; border: 1px solid var(--brand-border); border-left: 3px solid var(--brand-lime); background: var(--brand-surface); padding: 24px; font-family: var(--font-body); color: var(--brand-navy); border-radius: 8px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/x-sentinela-jsx" src="ui_kits/site/HomeScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/PestScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/TermiteScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/B2BScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/ScheduleScreen.jsx"></script>

<script type="text/x-sentinela-jsx">
const A = (p) => "assets/" + p;
const wa = (msg) => "https://wa.me/5516993747147?text=" + encodeURIComponent("Olá, Sentinela! " + (msg || "Acessei o site e gostaria de solicitar um orçamento para controle de pragas em Franca/SP."));

function App() {
  const [screen, setScreen] = React.useState("home");
  const [scrolled, setScrolled] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(false);
  const [hideFloatingWa, setHideFloatingWa] = React.useState(false);

  React.useEffect(() => {
    const mq = window.matchMedia("(max-width: 639px)");
    const sync = () => setIsMobile(mq.matches);
    sync();
    mq.addEventListener("change", sync);
    return () => mq.removeEventListener("change", sync);
  }, []);

  React.useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 40);
      const footer = document.getElementById("rodape-oficial");
      if (footer) {
        const rect = footer.getBoundingClientRect();
        setHideFloatingWa(rect.top < window.innerHeight - 80);
      }
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  React.useEffect(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [screen]);

  const { SiteHeader, SiteFooter, WhatsAppFloat, MobileStickyBar, LgpdBanner, gbpJsonLd } = DS;

  React.useEffect(() => {
    let tag = document.getElementById("gbp-json-ld");
    if (!tag) {
      tag = document.createElement("script");
      tag.type = "application/ld+json";
      tag.id = "gbp-json-ld";
      document.head.appendChild(tag);
    }
    tag.textContent = JSON.stringify(gbpJsonLd());
  }, []);

  const go = (s) => setScreen(s);
  const Screens = window.SentinelaKit || {};

  const current =
    (screen === "escorpiao" || screen === "praga") ? <Screens.PestScreen DS={DS} A={A} wa={wa} go={go} /> :
    screen === "cupins" ? <Screens.TermiteScreen DS={DS} A={A} wa={wa} go={go} /> :
    screen === "b2b" ? <Screens.B2BScreen DS={DS} A={A} wa={wa} go={go} /> :
    screen === "agendar" ? <Screens.ScheduleScreen DS={DS} A={A} wa={wa} go={go} /> :
    <Screens.HomeScreen DS={DS} A={A} wa={wa} go={go} />;

  return (
    <div className="sentinela-app" onClick={(e) => {
      const a = e.target.closest("a[href^='#']");
      if (!a) return;
      e.preventDefault();
      const key = a.getAttribute("href").slice(1);
      if (["home","escorpiao","praga","cupins","b2b","agendar"].includes(key)) go(key);
    }}>
      <SiteHeader scrolled={scrolled} logoSrc={A("logo-brasao.png")} />
      
      {current}

      <SiteFooter logoSrc={A("logo-brasao.png")} qrSrc={A("qrcode-whatsapp.png")} year={2026} />

      {!hideFloatingWa && (
        isMobile ? (
          <MobileStickyBar whatsappHref={wa("Preciso de atendimento urgente em Franca/SP.")} />
        ) : (
          <WhatsAppFloat href={wa("Olá! Gostaria de tirar uma dúvida sobre controle de pragas.")} />
        )
      )}

      <LgpdBanner />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
window.bootSentinela("./").catch((err) => {
  document.getElementById("root").innerHTML =
    '<div class="kit-missing"><p style="margin:0;font-weight:700;font-size:1.125rem;">Não foi possível carregar os componentes da aplicação</p><p style="margin:8px 0 0;font-size:14px;color:var(--brand-muted)">' + String(err) + '</p></div>';
});
</script>
</body>
</html>
