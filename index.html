<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinela Saúde Ambiental — Dedetizadora em Franca SP</title>
  <meta name="description" content="Controle profissional de pragas em Franca/SP e região. Escorpiões, baratas, cupins e roedores. Técnicos credenciados, sem cheiro e com laudo técnico.">
  <link rel="canonical" href="https://www.sentinelasaudeambiental.com.br/">
  <meta property="og:url" content="https://www.sentinelasaudeambiental.com.br/">
  <meta property="og:title" content="Sentinela Saúde Ambiental — Dedetizadora em Franca SP">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Fontes Oficiais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <!-- React & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>Babel.registerPreset("react-classic", { presets: [[Babel.availablePresets.react, { runtime: "classic" }]] });</script>
  <script src="ds-preview-loader.js"></script>
  
  <style>
    body { margin: 0; background: #fff; padding-bottom: 0; overflow-x: hidden; }
    .kit-missing { max-width: 620px; margin: 80px auto; border: 1px solid var(--brand-border); border-left: 3px solid var(--brand-lime); background: var(--brand-surface); padding: 24px; font-family: var(--font-body); color: var(--brand-navy); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .loading-spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 16px; font-family: 'Montserrat', sans-serif; color: var(--brand-navy); }
    .spinner-ring { width: 44px; height: 44px; border: 4px solid var(--brand-border); border-top-color: var(--brand-lime); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root">
  <div class="loading-spinner">
    <div class="spinner-ring"></div>
    <p style="font-weight: 700; font-size: 1.125rem;">Carregando Sentinela Saúde Ambiental...</p>
  </div>
</div>

<script type="text/x-sentinela-jsx" src="ui_kits/site/HomeScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/PestScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/B2BScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/ScheduleScreen.jsx"></script>

<script type="text/x-sentinela-jsx">
const A = (p) => "assets/" + p;
const wa = (msg) => "https://wa.me/5516993747147?text=" + encodeURIComponent("Olá, Sentinela! " + (msg || "Acessei o site e gostaria de solicitar um orçamento para controle de pragas."));

function App() {
  const [screen, setScreen] = React.useState("home");
  const [scrolled, setScrolled] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(false);

  React.useEffect(() => {
    const mq = window.matchMedia("(max-width: 639px)");
    const sync = () => setIsMobile(mq.matches);
    sync();
    mq.addEventListener("change", sync);
    return () => mq.removeEventListener("change", sync);
  }, []);

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  React.useEffect(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [screen]);

  const { SiteHeader, SiteFooter, WhatsAppFloat, MobileStickyBar, TrustCtaTrio, GbpMap, gbpJsonLd } = DS;

  React.useEffect(() => {
    let tag = document.getElementById("gbp-json-ld");
    if (!tag) {
      tag = document.createElement("script");
      tag.type = "application/ld+json";
      tag.id = "gbp-json-ld";
      document.head.appendChild(tag);
    }
    tag.textContent = JSON.stringify(gbpJsonLd());
  }, []);

  const nav = [
    { href: "#home", label: "Início" },
    { href: "#praga", label: "Escorpião" },
    { href: "#b2b", label: "Condomínios & B2B" },
    { href: "#agendar", label: "Orçamento WhatsApp" },
  ];

  const go = (s) => setScreen(s);
  const Screens = window.SentinelaKit || {};

  const current =
    screen === "praga" ? <Screens.PestScreen DS={DS} A={A} wa={wa} go={go} /> :
    screen === "b2b" ? <Screens.B2BScreen DS={DS} A={A} wa={wa} go={go} /> :
    screen === "agendar" ? <Screens.ScheduleScreen DS={DS} A={A} wa={wa} go={go} /> :
    <Screens.HomeScreen DS={DS} A={A} wa={wa} go={go} />;

  return (
    <div className="sentinela-app animate-fade-up" onClick={(e) => {
      const a = e.target.closest("a[href^='#']");
      if (!a) return;
      e.preventDefault();
      const key = a.getAttribute("href").slice(1);
      if (["home","praga","b2b","agendar"].includes(key)) go(key);
    }}>
      <SiteHeader scrolled={scrolled} navLinks={nav} logoSrc={A("logo-brasao.png")} whatsappHref={wa("Olá! Gostaria de falar com um especialista.")} />
      
      {current}

      {/* SEÇÃO INFERIOR COM TRIO DE CONVERSÃO E MAPA GBP */}
      <section style={{ background: "var(--brand-navy)", padding: "56px 0 64px", borderTop: "2px solid var(--brand-lime)" }}>
        <div className="container-responsive" style={{ display: "grid", gap: 40, padding: "0 16px" }}>
          <div style={{ maxWidth: 900, marginInline: "auto", width: "100%" }}>
            <TrustCtaTrio onNavigate={go} showBadge={true} />
          </div>
          <GbpMap />
        </div>
      </section>

      <SiteFooter logoSrc={A("logo-brasao.png")} year={2026} />

      {isMobile ? (
        <MobileStickyBar whatsappHref={wa("Preciso de atendimento urgente em Franca/SP.")} />
      ) : (
        <WhatsAppFloat href={wa("Olá! Gostaria de tirar uma dúvida sobre controle de pragas.")} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
window.bootSentinela("./").catch((err) => {
  document.getElementById("root").innerHTML =
    '<div class="kit-missing"><p style="margin:0;font-weight:700;font-size:1.125rem;">Não foi possível carregar os componentes da aplicação</p><p style="margin:8px 0 0;font-size:14px;color:var(--brand-muted)">' + String(err) + '</p></div>';
});
</script>
</body>
</html>
