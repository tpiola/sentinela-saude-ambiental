<body>
<div id="root"></div>

<script type="text/x-sentinela-jsx" src="ui_kits/site/HomeScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/PestScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/TermiteScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/PestCatalogScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/B2BScreen.jsx"></script>
<script type="text/x-sentinela-jsx" src="ui_kits/site/ScheduleScreen.jsx"></script>

<script type="text/x-sentinela-jsx">
const A = (p) => "assets/" + p;
const wa = (msg) => "https://wa.me/5516993747147?text=" + encodeURIComponent("Olá, Sentinela! " + (msg || "Acessei o site e gostaria de solicitar um orçamento para controle de pragas em Franca/SP."));

const KNOWN_PESTS = ["escorpiao", "cupins", "baratas", "ratos", "aranhas", "formigas", "mosquitos", "pulgas", "vespas", "caixa-dagua"];

function App() {
  const [screen, setScreen] = React.useState("home");
  const [selectedPest, setSelectedPest] = React.useState("escorpiao");
  const [scrolled, setScrolled] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(false);
  const [hideFloatingWa, setHideFloatingWa] = React.useState(false);

  React.useEffect(() => {
    const mq = window.matchMedia("(max-width: 639px)");
    const sync = () => setIsMobile(mq.matches);
    sync();
    mq.addEventListener("change", sync);
    return () => mq.removeEventListener("change", sync);
  }, []);

  React.useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 40);
      const footer = document.getElementById("rodape-oficial");
      if (footer) {
        const rect = footer.getBoundingClientRect();
        setHideFloatingWa(rect.top < window.innerHeight - 80);
      }
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  React.useEffect(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [screen, selectedPest]);

  const { SiteHeader, SiteFooter, WhatsAppFloat, MobileStickyBar, LgpdBanner, gbpJsonLd } = DS;

  React.useEffect(() => {
    let tag = document.getElementById("gbp-json-ld");
    if (!tag) {
      tag = document.createElement("script");
      tag.type = "application/ld+json";
      tag.id = "gbp-json-ld";
      document.head.appendChild(tag);
    }
    tag.textContent = JSON.stringify(gbpJsonLd());
  }, []);

  const go = (s, pest = null) => {
    if (pest) setSelectedPest(pest);
    setScreen(s);
  };
  
  const Screens = window.SentinelaKit || {};

  let current;
  if (screen === "pragas" || KNOWN_PESTS.includes(screen)) {
    const pestKey = KNOWN_PESTS.includes(screen) ? screen : selectedPest;
    current = <Screens.PestCatalogScreen DS={DS} A={A} wa={wa} go={go} initialPest={pestKey} />;
  } else if (screen === "b2b") {
    current = <Screens.B2BScreen DS={DS} A={A} wa={wa} go={go} />;
  } else if (screen === "agendar") {
    current = <Screens.ScheduleScreen DS={DS} A={A} wa={wa} go={go} />;
  } else {
    current = <Screens.HomeScreen DS={DS} A={A} wa={wa} go={go} />;
  }

  return (
    <div className="sentinela-app" onClick={(e) => {
      const a = e.target.closest("a[href^='#']");
      if (!a) return;
      e.preventDefault();
      const key = a.getAttribute("href").slice(1);
      if (KNOWN_PESTS.includes(key)) {
        go("pragas", key);
      } else if (["home", "b2b", "agendar", "pragas"].includes(key)) {
        go(key);
      }
    }}>
      <SiteHeader scrolled={scrolled} logoSrc={A("logo-brasao.png")} />
      
      {current}

      <SiteFooter logoSrc={A("logo-brasao.png")} qrSrc={A("qrcode-whatsapp.png")} year={2026} />

      {!hideFloatingWa && (
        isMobile ? (
          <MobileStickyBar whatsappHref={wa("Preciso de atendimento urgente em Franca/SP.")} />
        ) : (
          <WhatsAppFloat href={wa("Olá! Gostaria de tirar uma dúvida sobre controle de pragas.")} />
        )
      )}

      <LgpdBanner />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
window.bootSentinela("./").catch((err) => {
  document.getElementById("root").innerHTML =
    '<div class="kit-missing"><p style="margin:0;font-weight:700;font-size:1.125rem;">Não foi possível carregar os componentes da aplicação</p><p style="margin:8px 0 0;font-size:14px;color:var(--brand-muted)">' + String(err) + '</p></div>';
});
</script>
